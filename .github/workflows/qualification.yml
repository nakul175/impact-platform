name: Application qualification
# Push runs only on main. Every other branch is qualified by its pull request, so a commit
# is not billed twice (once for the branch push and once for the same pull request). A
# documentation-only change does not start the suite. workflow_dispatch still runs the full
# suite on any ref, with no path filter.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
# One in-flight run per pull request, and one per branch for a main push or a manual run.
# A newer commit cancels the run it replaces. A main push is left to finish: that run is the
# record of what landed, and merges are not the rapid-push case this cancellation is for.
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # native-postgresql-gate is not gated on this job. On the last green main run (2026-10-02,
  # 36963825369) this job took 12m24s and the native job 14m43s, overlapping. Waiting would
  # add this job's duration to every green run's wall clock and would not reduce the minutes
  # of a green run, because both jobs would still execute. The minutes it would save are only
  # the native job's when this job has already failed. Duplicate runs, cancelled superseded
  # pull requests, documentation skips and the timeouts below save minutes on the common path.
  local-reference-and-browser:
    runs-on: ubuntu-24.04
    # Last green main run: 12m24s. 30 leaves headroom for a slow runner and stops a hang
    # well short of the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: make setup
      - run: make lint test reference
      - run: make browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-qualification
          # The runners' database and API logs (synthetic data only) diagnose a PGlite failure.
          path: |
            docs/evidence/
            .local/test-*/database.log
            .local/test-*/api.log
  live-identity-provider:
    runs-on: ubuntu-24.04
    # Last green main run: 2m59s. 20 covers a cache miss on the Keycloak archive.
    timeout-minutes: 20
    env:
      # Keep in step with KEYCLOAK_VERSION in scripts/idp.py; the script verifies the pinned SHA-256
      # of the cached or downloaded archive before unpacking it.
      KEYCLOAK_VERSION: 26.7.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Keycloak distribution
        uses: actions/cache@v5
        with:
          path: .local/keycloak/keycloak-${{ env.KEYCLOAK_VERSION }}.tar.gz
          key: keycloak-${{ env.KEYCLOAK_VERSION }}
      - run: make setup
      - name: Fetch and verify Keycloak
        run: .venv/bin/python scripts/idp.py fetch
      - name: Live identity-provider qualification on PGlite
        run: .venv/bin/python scripts/run.py test --idp keycloak --pytest-path qualification/test_live_idp.py
      - name: Live identity-provider browser check
        if: always()
        run: |
          npm ci --prefix tools/browser
          node tools/browser/prepare.mjs
          .venv/bin/python scripts/run.py idp-browser --idp keycloak
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-identity-provider-qualification
          path: |
            docs/evidence/idp-tests.xml
            docs/evidence/idp-qualification.json
            docs/evidence/idp-browser-tests.json
  native-postgresql-gate:
    runs-on: ubuntu-24.04
    # Last green main run: 14m43s, including the client install, restore drill, upgrade
    # check and the live-provider pass. 40 is the hang cap; the job still starts with the
    # others (see the note on local-reference-and-browser).
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: impact_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d impact_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The superuser connection is used only to provision the login roles, load the fixture and
      # run database assertions; scripts/run.py never hands it to the API process.
      IMPACT_ADMIN_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test
      IMPACT_FIXTURE_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - name: Generate throwaway passwords for the five runtime logins
        run: |
          for name in APP IDENTITY PLATFORM WORKER MIGRATOR; do
            value=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
            echo "::add-mask::$value"
            echo "IMPACT_LOGIN_PASSWORD_$name=$value" >> "$GITHUB_ENV"
          done
      - name: Provision the login roles as the postgres superuser
        run: .venv/bin/python scripts/provision_logins.py
      - name: Qualification suite on the provisioned login roles, then the API restart check
        run: .venv/bin/python scripts/run.py test --native --skip-upgrade-check --skip-restore-drill
      - name: Install PostgreSQL 17 client tools from the PGDG repository
        # The service container runs PostgreSQL 17 while the runner image ships the 16 client;
        # pg_dump refuses a server newer than itself, so the drill uses the 17 binaries. The
        # downloaded signing key is trusted only if its primary fingerprint is the published PGDG
        # one (B97B0AFC AA1A47F0 44F244A0 7FCC7D46 ACCC4CF8); the package is major-version pinned.
        if: always()
        env:
          PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-fingerprint "$key"
          actual=$(gpg --show-keys --with-fingerprint --with-colons "$key" | awk -F: '$1=="fpr"{print $10; exit}')
          if [ "$actual" != "$PGDG_KEY_FINGERPRINT" ]; then
            echo "PGDG signing key fingerprint mismatch: got '$actual', expected '$PGDG_KEY_FINGERPRINT'" >&2
            sudo rm -f "$key"
            exit 1
          fi
          echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Backup and restore drill of the database the suite used
        if: always()
        env:
          IMPACT_PG_BIN: /usr/lib/postgresql/17/bin
        run: .venv/bin/python scripts/restore_drill.py --report docs/evidence/native-qualification.json
      - name: Upgrade a populated database at the deployed schema to the latest
        if: always()
        env:
          # The schema staging runs (build 0.26.0); move it when a build with new migrations is deployed.
          IMPACT_UPGRADE_BASELINE: '32'
        run: .venv/bin/python scripts/native_upgrade_check.py --report docs/evidence/native-qualification.json
      - uses: actions/setup-java@v5
        if: always()
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Keycloak distribution
        if: always()
        uses: actions/cache@v5
        with:
          path: .local/keycloak/keycloak-26.7.4.tar.gz
          key: keycloak-26.7.4
      - name: Live identity-provider checks on the provisioned login roles (separate empty database)
        # Callback, logout and back-channel SQL on the impact_identity login under
        # IMPACT_REQUIRE_UNPRIVILEGED_DB; the job's service has no Keycloak, the runner starts it.
        if: always()
        env:
          IMPACT_FIXTURE_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test_idp
        run: |
          .venv/bin/python -c "import psycopg; c = psycopg.connect('postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test', autocommit=True); c.execute('DROP DATABASE IF EXISTS impact_test_idp WITH (FORCE)'); c.execute('CREATE DATABASE impact_test_idp')"
          .venv/bin/python scripts/idp.py fetch
          .venv/bin/python scripts/run.py test --native --idp keycloak
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-postgresql-qualification
          path: |
            docs/evidence/native-application-tests.xml
            docs/evidence/native-qualification.json
            docs/evidence/native-restore-drill.json
            docs/evidence/idp-native-tests.xml
            docs/evidence/idp-qualification.json
      - name: Native critical subset through PgBouncer in transaction mode (QA 2026-10 non-functional; advisory)
        # Opt-in evidence, not a gate: the API and the worker reach the service database through a
        # PgBouncer the runner starts in transaction pooling mode (scripts/pooler.py) on a separate
        # empty database; the focused run overwrites the native evidence files, so it runs after
        # their upload and keeps its own copies.
        if: always()
        continue-on-error: true
        env:
          IMPACT_FIXTURE_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test_pooler
          IMPACT_PORT: '8472'
        run: |
          sudo apt-get install -y --no-install-recommends pgbouncer
          .venv/bin/python -c "import psycopg; c = psycopg.connect('postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test', autocommit=True); c.execute('DROP DATABASE IF EXISTS impact_test_pooler WITH (FORCE)'); c.execute('CREATE DATABASE impact_test_pooler')"
          code=0
          .venv/bin/python scripts/run.py test --native --pooler pgbouncer --pytest-path qualification/test_native_nonfunctional.py --pytest-path qualification/test_native_concurrency.py --skip-restart-check --skip-restore-drill --skip-upgrade-check || code=$?
          mkdir -p .local/pooler-evidence
          cp docs/evidence/native-application-tests.xml docs/evidence/native-qualification.json .local/pooler-evidence/ || true
          exit $code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-pooler-qualification
          path: .local/pooler-evidence/
  container-stack:
    # The staging deployment package (v0.17) end to end on the runner: deploy/update.sh builds the
    # image and brings up PostgreSQL, Keycloak (production mode), the API, the worker with its mail
    # capture, Caddy and the backup service exactly as on the server, except that Caddy issues
    # certificates from its internal CA (CADDY_TLS_MODE=internal) for fake host names mapped to
    # 127.0.0.1. Then: the smoke check over HTTPS, a second deployment run (idempotence), the
    # owner's first sign-in through the provider (password change, authenticator enrolment, MFA
    # assurance, platform operator), add-user, list-users and reset-user, a backup set (both
    # databases, roles, the evidence object volume, manifest) verified and restored, the restore
    # drill on throwaway containers, the operations check and its alerts, and the host timers.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        # bash -eo pipefail: a check piped into tee (smoke, first sign-in, second run) fails the step
        # when the check fails; the default `bash -e` took tee's exit status and hid failures.
        shell: bash
    env:
      APP_HOST: impact.test
      OWNER_EMAIL: owner@example.org
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - name: Map the fake host names to this runner and write the deployment overrides
        run: |
          echo "127.0.0.1 $APP_HOST auth.$APP_HOST" | sudo tee -a /etc/hosts
          echo "IMPACT_HOME=$RUNNER_TEMP/impact" >> "$GITHUB_ENV"
          sudo install -d -m 700 "$RUNNER_TEMP/impact"
          printf 'IMPACT_APP_HOST=%s\nCADDY_TLS_MODE=internal\nIMPACT_OWNER_EMAIL=%s\nIMPACT_OWNER_FIRST_NAME=CI\nIMPACT_OWNER_LAST_NAME=Owner\nACME_EMAIL=ci@example.org\n' \
            "$APP_HOST" "$OWNER_EMAIL" | sudo tee "$RUNNER_TEMP/impact/config.env" >/dev/null
      - name: First deployment (deploy/update.sh as on the server)
        run: sudo IMPACT_HOME="$IMPACT_HOME" deploy/update.sh
      - name: Trust Caddy's internal root for the checks below
        run: sudo cat "$IMPACT_HOME/ca/caddy-root.crt" > caddy-root.crt
      - name: Smoke check over HTTPS
        run: .venv/bin/python scripts/smoke.py "https://$APP_HOST" --cacert caddy-root.crt | tee smoke-first.json
      - name: Executor heartbeat and backend-only network
        run: |
          compose() { sudo docker compose -p impact -f deploy/compose.yaml --env-file "$IMPACT_HOME/compose.env" "$@"; }
          for i in $(seq 1 20); do
            beat=$(compose exec -T postgres psql -U postgres -d impact -Atc "SELECT count(*) FROM impact.executor_heartbeat WHERE executor_id='staging-executor-1' AND state='RUNNING' AND beat_at>statement_timestamp()-interval '60 seconds'")
            [ "$beat" = 1 ] && break
            sleep 3
          done
          [ "$beat" = 1 ]
          container=$(compose ps -q executor)
          networks=$(sudo docker inspect "$container" --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}} {{end}}')
          [ "$(echo "$networks" | xargs)" = impact_backend ]
      - name: Second deployment run changes nothing
        run: |
          sudo IMPACT_HOME="$IMPACT_HOME" deploy/update.sh | tee second-run.log
          grep -q "already deployed and healthy" second-run.log
          sudo python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['result']=='ok' and d['step']=='unchanged', d" "$IMPACT_HOME/status.json"
      - name: first-admin.sh reveals the temporary password only while it is pending
        run: |
          sudo IMPACT_HOME="$IMPACT_HOME" IMPACT_ALLOW_NON_TTY=1 deploy/first-admin.sh > first-admin.out
          grep -q "Temporary password:" first-admin.out
          rm -f first-admin.out
          if sudo IMPACT_HOME="$IMPACT_HOME" deploy/first-admin.sh > /dev/null 2>&1; then echo "printed to a pipe" >&2; exit 1; fi
      - name: The owner's first sign-in, then a second operator onboarded through the platform (no console)
        run: |
          password=$(sudo sed -n 's/^OWNER_TEMP_PASSWORD=//p' "$IMPACT_HOME/secrets.env")
          echo "::add-mask::$password"
          # v0.26a: after the owner's first sign-in the same session nominates operator2, creates its
          # sign-in through the impact-provisioner service account, signs it in for the first time
          # (own password, authenticator) and accepts; the one-time password is never printed.
          IMPACT_TEMP_PASSWORD="$password" .venv/bin/python scripts/staging_first_login.py "https://$APP_HOST" \
            --email "$OWNER_EMAIL" --cacert caddy-root.crt --onboard-operator operator2@example.org | tee first-login.json
          python3 -c "import json; d=json.load(open('first-login.json')); o=d['operator_onboarding']; assert d['passed'] and o['accepted'] and o['active_operators'] >= 2, d"
          again=$(sudo IMPACT_HOME="$IMPACT_HOME" IMPACT_ALLOW_NON_TTY=1 deploy/first-admin.sh)
          grep -q "already chosen its own password" <<<"$again"
      - name: add-user.sh registers a second person without authority
        run: |
          sudo IMPACT_HOME="$IMPACT_HOME" IMPACT_ALLOW_NON_TTY=1 deploy/add-user.sh second@example.org Second Person > add-user.out
          grep -q "Account created for second@example.org" add-user.out
          rm -f add-user.out
      - name: Secret rotation keeps the deployment healthy (rotate, smoke, retire, smoke)
        run: |
          fail() { echo "::error title=Secret rotation::$1"; for f in rotate-dry.json rotate.log rotate-status.json retire.log smoke-rotated.json smoke-retired.json; do [ -f "$f" ] && { echo "--- $f"; tail -n 40 "$f"; }; done; exit 1; }
          rotate() { sudo IMPACT_HOME="$IMPACT_HOME" deploy/rotate-secrets.sh "$@"; }
          rotate rotate --family all --dry-run > rotate-dry.json 2>&1 || fail "dry run"
          rotate rotate --family all --reason "CI rotation" > rotate.log 2>&1 || fail "rotate"
          rotate status > rotate-status.json 2>&1 || fail "status"
          # Every keyring family keeps one grace key; the provisioner family (v0.27) has none: its new
          # secret was re-aligned at the identity provider, which now reports nothing left to change.
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert all(len(f['grace'])==(0 if n=='provisioner' else 1) for n,f in d['families'].items()) and 'provisioner' in d['families'], d" rotate-status.json || fail "one grace key per family"
          grep -q '"family": "provisioner"' rotate.log || fail "the provisioner family was not rotated"
          realigned=$(sudo docker compose -p impact -f deploy/compose.yaml --env-file "$IMPACT_HOME/compose.env" run --rm -T idp-admin python deploy/keycloak_admin.py rotate-provisioner 2>/dev/null | tail -n 1)
          python3 -c "import json,sys; d=json.loads(sys.argv[1]); assert d.get('changed') is False, d" "$realigned" || fail "the identity provider does not hold the rotated provisioner secret"
          .venv/bin/python scripts/smoke.py "https://$APP_HOST" --cacert caddy-root.crt > smoke-rotated.json || fail "smoke after rotation"
          rotate retire --family all --all-previous --reason "CI retire" > retire.log 2>&1 || fail "retire"
          .venv/bin/python scripts/smoke.py "https://$APP_HOST" --cacert caddy-root.crt > smoke-retired.json || fail "smoke after retirement"
          # No secret value reaches the output: compare every value of secrets.env with what was printed.
          sudo python3 -c "
          import sys
          printed = ''.join(open(p).read() for p in sys.argv[2:])
          for line in open(sys.argv[1]):
              value = line.partition('=')[2].strip()
              for part in value.split(','):
                  assert len(part) < 16 or part not in printed, 'a secret value was printed'
          " "$IMPACT_HOME/secrets.env" rotate-dry.json rotate.log rotate-status.json retire.log || fail "a secret value was printed"
          cat rotate.log retire.log
      - name: list-users.sh and reset-user.sh (console only)
        run: |
          sudo IMPACT_HOME="$IMPACT_HOME" deploy/list-users.sh | tee list-users.out
          grep -q "$OWNER_EMAIL" list-users.out
          grep -q "second@example.org .*has not signed in yet" list-users.out
          sudo IMPACT_HOME="$IMPACT_HOME" IMPACT_ALLOW_NON_TTY=1 deploy/reset-user.sh second@example.org --totp > reset.out
          grep -q "One-time password:" reset.out
          grep -q "authenticator app was removed" reset.out
          rm -f reset.out list-users.out
          if sudo IMPACT_HOME="$IMPACT_HOME" deploy/reset-user.sh second@example.org > /dev/null 2>&1; then echo "printed to a pipe" >&2; exit 1; fi
          if sudo IMPACT_HOME="$IMPACT_HOME" IMPACT_ALLOW_NON_TTY=1 deploy/reset-user.sh nobody@example.org > /dev/null 2>&1; then echo "reset an absent account" >&2; exit 1; fi
          ! sudo grep -rq "One-time password" "$IMPACT_HOME/state" /var/log/impact-*.log 2>/dev/null
      - name: A backup set (databases, roles, objects, manifest) is verified and restores
        run: |
          compose() { sudo docker compose -p impact -f deploy/compose.yaml --env-file "$IMPACT_HOME/compose.env" "$@"; }
          # One synthetic content-addressed object in the evidence volume, so the set carries one.
          compose exec -T api python -c 'import hashlib,os; d=os.urandom(4096); h=hashlib.sha256(d).hexdigest(); p="/var/lib/impact/objects/00000000-0000-4000-8000-000000000001/"+h[:2]; os.makedirs(p,0o700,exist_ok=True); open(p+"/"+h,"wb").write(d)'
          # The set taken when the service started predates the operator bootstrap; take one now.
          for i in $(seq 1 30); do compose exec -T backup sh -c 'ls /backups/daily/[0-9]*/manifest.json' && break; sleep 5; done
          compose exec -T backup /bin/bash /opt/backup/backup.sh --now
          sudo cat "$IMPACT_HOME/ops/backup-status.json" | tee backup-status.json
          python3 -c "import json,sys; d=json.load(open('backup-status.json')); assert d['result']=='ok' and d['last_success']['objects']>=1 and d['last_success']['schema_version']>=26, d"
          compose exec -T backup bash -c 'set -e; s=$(ls -d /backups/daily/[0-9]* | tail -1); cat "$s/manifest.json"; ls -l "$s";
            (cd "$s" && sha256sum --check --strict SHA256SUMS);
            dropdb --if-exists impact_restore_check; createdb impact_restore_check;
            pg_restore --exit-on-error -d impact_restore_check "$s/impact.dump";
            n=$(psql -Atd impact_restore_check -c "select count(*) from impact.schema_migration");
            o=$(psql -Atd impact_restore_check -c "select count(*) from impact.platform_operator");
            a=$(psql -Atd impact_restore_check -c "select count(*) from impact.platform_operator_nomination where state='"'"'Accepted'"'"'");
            echo "restored $s: $n migrations, $o platform operator(s), $a accepted nomination(s)"; test "$n" -ge 20;
            # The bootstrap operator plus operator2, onboarded through the platform in an earlier step.
            test "$o" -eq 2; test "$a" -eq 1;
            dropdb impact_restore_check'
      - name: Restore drill on throwaway containers (measured restore time)
        run: |
          status=0
          sudo IMPACT_HOME="$IMPACT_HOME" deploy/restore-drill.sh | tee drill.log || status=$?
          sudo cat "$IMPACT_HOME/ops/restore-drill.json" | tee restore-drill.json
          if [ "$status" -ne 0 ]; then
            echo "::error title=restore drill::$(tail -n 4 drill.log | tr '\n' ' ' | cut -c1-3000)"
            exit "$status"
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("restore-drill.json"))
          assert d["outcome"] == "PASS", d
          assert all(d["checks"].values()) and d["objects"]["files"] >= 1, d
          print("::notice title=restore drill::PASS in %ss (restore %s; set %s, %s bytes, %s h old; %s tables, %s rows)" % (
              d["duration_seconds"], json.dumps(d["restore_seconds"]), d["set"], d["set_bytes"],
              d["backup_age_hours"], d["restored"]["tables"], d["restored"]["rows"]))
          PY
          # Nothing of the drill is left behind.
          test -z "$(sudo docker ps -aq --filter label=com.docker.compose.service=drill-db)"
      - name: Operations check, alerts and host timers
        run: |
          sudo IMPACT_HOME="$IMPACT_HOME" deploy/ops-check.sh
          sudo cat "$IMPACT_HOME/ops/ops-status.json" | tee ops-status.json
          sudo cat "$IMPACT_HOME/status.json" > deploy-status-ops.json
          python3 - <<'PY'
          import json, sys
          ops = json.load(open("ops-status.json"))
          status = json.load(open("deploy-status-ops.json"))
          codes = [a["code"] for a in ops["alerts"]]
          problems = []
          critical = [a for a in ops["alerts"] if a["severity"] == "critical"]
          if critical:
              problems.append("critical alerts: " + json.dumps(critical))
          if status.get("alerts") != ops["alerts"] or not (status.get("operations") or {}).get("backup", {}).get("last_set"):
              problems.append("status file lacks the operations: " + json.dumps({k: status.get(k) for k in ("alerts", "operations")})[:1500])
          if ops["operations"]["restore_drill"].get("outcome") != "PASS":
              problems.append("drill: " + json.dumps(ops["operations"]["restore_drill"]))
          if not (ops["operations"].get("workers") or {}).get("running_fresh"):
              problems.append("workers: " + json.dumps(ops["operations"].get("workers")))
          for p in problems:
              print("::error title=operations check::" + p[:3500])
          print("::notice title=operations check::alerts " + json.dumps(codes) + " services " + json.dumps(ops["operations"].get("services")))
          sys.exit(1 if problems else 0)
          PY
          systemctl is-enabled impact-ops-check.timer impact-restore-drill.timer || { echo "::error title=timers::not enabled"; exit 1; }
          systemctl list-timers 'impact-*' --all --no-pager
          test -s /etc/logrotate.d/impact || { echo "::error title=logrotate::no /etc/logrotate.d/impact"; exit 1; }
          sudo logrotate --debug /etc/logrotate.d/impact > logrotate.out 2>&1 || { echo "::error title=logrotate::$(tail -n 5 logrotate.out | tr '\n' ' ')"; exit 1; }
      - name: Readiness exercise - an injected failure (worker stopped) is alerted, delivered to a webhook, and clears
        run: |
          # Release 0.27: the exercise script stops the worker, expects WORKER_STALE and
          # CONTAINER_UNHEALTHY from the next check, restarts it, waits for the alerts to clear, and
          # simulates a nearly full disk against a scratch copy. Alert transitions are delivered to a
          # loopback webhook receiver that verifies the HMAC signature.
          export ALERT_WEBHOOK_SECRET="ci-webhook-secret-$(date +%s)"
          python3 scripts/webhook_receiver.py --port 18080 --log "$RUNNER_TEMP/webhook.jsonl" > receiver.out 2>&1 &
          sleep 1
          printf 'ALERT_WEBHOOK_URL=http://127.0.0.1:18080/hook\nALERT_WEBHOOK_SECRET=%s\n' "$ALERT_WEBHOOK_SECRET" | sudo tee -a "$IMPACT_HOME/config.env" >/dev/null
          # The baseline check consumes the alerts that were already active, so the exercise sees only its own.
          sudo IMPACT_HOME="$IMPACT_HOME" deploy/ops-check.sh >/dev/null
          started=$(date +%s)
          if ! sudo IMPACT_HOME="$IMPACT_HOME" deploy/readiness-exercise.sh | tee exercise.out; then
            echo "::error title=readiness exercise::failed; see readiness-exercise.json"
            sudo cat "$IMPACT_HOME/ops/readiness-exercise.json" || true
            exit 1
          fi
          sudo cat "$IMPACT_HOME/ops/readiness-exercise.json" | tee readiness-exercise.json
          python3 - <<'PY'
          import json
          record = json.load(open("readiness-exercise.json"))
          steps = {s["step"]: s for s in record["steps"]}
          assert record["outcome"] == "PASS", record
          assert "WORKER_STALE" in steps["worker_stopped"]["detail"]["alerts"], steps["worker_stopped"]
          assert "CONTAINER_UNHEALTHY" in steps["worker_stopped"]["detail"]["alerts"], steps["worker_stopped"]
          print("::notice title=readiness exercise::PASS; worker stopped -> alerted in %ss, restarted -> cleared in %ss (%s checks); disk simulation %s" % (
              steps["worker_stopped"]["seconds"], steps["worker_started"]["seconds"],
              steps["worker_started"]["detail"]["checks"], steps["disk_simulation"]["outcome"]))
          PY
          cp "$RUNNER_TEMP/webhook.jsonl" webhook.jsonl
          python3 - <<'PY'
          import json
          received = [json.loads(line) for line in open("webhook.jsonl")]
          assert received, "the webhook receiver got nothing"
          assert all(r["signature_valid"] is True for r in received), [r["signature_valid"] for r in received]
          events = [(e["event"], sorted(a["code"] for a in e["alerts"])) for r in received for e in r["body"]["events"]]
          assert any(k == "NEW" and "WORKER_STALE" in codes for k, codes in events), events
          assert any(k == "CLEARED" and "WORKER_STALE" in codes for k, codes in events), events
          assert any(k == "NEW" and "DISK_LOW" in codes for k, codes in events), events
          assert any(k == "CLEARED" and "DISK_LOW" in codes for k, codes in events), events
          text = json.dumps(received)
          assert "ci-webhook-secret" not in text and all(r["body"]["schema"] == "impact-alert-v1" for r in received)
          assert all(r["body"]["text"].startswith("[impact ") for r in received), [r["body"]["text"][:60] for r in received]
          print("::notice title=alert delivery::%d signed webhook deliveries: %s" % (len(received), json.dumps(events)))
          PY
          pkill -f scripts/webhook_receiver.py || true
      - name: Smoke check after the sign-in
        run: .venv/bin/python scripts/smoke.py "https://$APP_HOST" --cacert caddy-root.crt | tee smoke-final.json
      - name: Status and logs on failure
        if: always()
        run: |
          sudo cat "$IMPACT_HOME/status.json" > deploy-status.json || true
          sudo docker compose -p impact -f deploy/compose.yaml --env-file "$IMPACT_HOME/compose.env" ps --all || true
          sudo docker compose -p impact -f deploy/compose.yaml --env-file "$IMPACT_HOME/compose.env" logs --no-color --tail 150 > compose-logs.txt || true
          tail -n 60 compose-logs.txt || true
      - name: Failure details as annotations (readable without signing in)
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, re
          def annotate(title, lines):
              text = "\n".join(lines)[-3800:]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=" + title + "::" + text)
          try:
              status = json.load(open("deploy-status.json"))
              annotate("deploy step " + str(status.get("step")), status.get("log_tail", []))
              annotate("services", [k + ": " + json.dumps(v) for k, v in status.get("services", {}).items()])
          except (OSError, ValueError) as e:
              annotate("no status file", [repr(e)])
          try:
              logs = open("compose-logs.txt", errors="replace").read().splitlines()
          except OSError:
              logs = []
          for service in ("api", "keycloak", "caddy", "worker", "executor", "postgres", "backup", "mailsink"):
              mine = [l for l in logs if re.match(r"^" + service + r"[-_ ]", l)]
              if mine:
                  annotate("logs " + service, mine[-25:])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: container-stack
          path: |
            smoke-first.json
            smoke-final.json
            first-login.json
            deploy-status.json
            backup-status.json
            restore-drill.json
            ops-status.json
            compose-logs.txt
