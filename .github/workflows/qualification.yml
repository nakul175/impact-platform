name: Application qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-reference-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make setup
      - run: make lint test reference
      - run: make browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-qualification
          path: docs/evidence/
  native-postgresql-gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: impact_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d impact_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMPACT_FIXTURE_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/impact_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: .venv/bin/python scripts/run.py test --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-postgresql-qualification
          path: docs/evidence/application-tests.xml
