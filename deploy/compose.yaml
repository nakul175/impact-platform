# Impact Platform on one server: PostgreSQL, Keycloak, the API, the outbox worker, Caddy and the
# nightly backup. deploy/update.sh generates the environment file this reads (secrets, host names,
# image tag) and runs it; see docs/current/DEPLOYMENT-GUIDE.md. Only Caddy publishes ports (80, 443).
#
#   docker compose -p impact -f deploy/compose.yaml --env-file /opt/impact/compose.env <command>
name: impact

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: impact-platform:${IMPACT_TAG:?image tag required}
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp:size=64m"]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: impact
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impact"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot jobs (profile "jobs"): run by deploy/update.sh with `docker compose run --rm`.
  migrate:
    <<: *app
    profiles: ["jobs"]
    command: ["python", "deploy/prepare_database.py"]
    environment:
      IMPACT_ADMIN_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/impact
      IMPACT_LOGIN_PASSWORD_APP: ${IMPACT_LOGIN_PASSWORD_APP:?}
      IMPACT_LOGIN_PASSWORD_IDENTITY: ${IMPACT_LOGIN_PASSWORD_IDENTITY:?}
      IMPACT_LOGIN_PASSWORD_PLATFORM: ${IMPACT_LOGIN_PASSWORD_PLATFORM:?}
      IMPACT_LOGIN_PASSWORD_WORKER: ${IMPACT_LOGIN_PASSWORD_WORKER:?}
      IMPACT_LOGIN_PASSWORD_EXECUTOR: ${IMPACT_LOGIN_PASSWORD_EXECUTOR:?}
      IMPACT_LOGIN_PASSWORD_MIGRATOR: ${IMPACT_LOGIN_PASSWORD_MIGRATOR:?}
      IMPACT_KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  operator-bootstrap:
    <<: *app
    profiles: ["jobs"]
    command: ["python", "scripts/bootstrap_operator.py", "--help"]
    environment:
      IMPACT_MIGRATION_DSN: postgresql://impact_migrator:${IMPACT_LOGIN_PASSWORD_MIGRATOR}@postgres:5432/impact
      IMPACT_ENVIRONMENT: staging
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  idp-admin:
    <<: *app
    profiles: ["jobs"]
    command: ["python", "deploy/keycloak_admin.py", "--help"]
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USER: impact-admin
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      IMPACT_REALM: impact
      IMPACT_PUBLIC_ORIGIN: https://${APP_HOST}
      IMPACT_PROVISIONER_SECRET: ${IMPACT_PROVISIONER_SECRET:-}
    volumes:
      - ./keycloak/realm-staging.json:/app/deploy/keycloak/realm-staging.json:ro
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    logging: *logging
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://${AUTH_HOST:?}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: impact-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
    networks: [backend, edge]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # The image has bash but no curl or grep: ask the management port directly. Only a 200
      # answer is ready (a DOWN report is a 503 whose body still lists checks that are UP).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          { IFS= read -r -d '' reply <&3 || true; } &&
          [[ $$reply == 'HTTP/1.'?' 200 '* ]]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  api:
    <<: [*app, *hardened]
    # The one image build (deploy/update.sh runs `docker compose build api` once per commit); every
    # other application service and job runs the same tag.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      IMPACT_ENVIRONMENT: staging
      IMPACT_REQUIRE_UNPRIVILEGED_DB: "1"
      # API only: advisory is explicitly enabled by an operator, never bundled into the image.
      IMPACT_AI_ENABLED: ${IMPACT_AI_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IMPACT_AI_MODEL: ${IMPACT_AI_MODEL:-gpt-5-mini}
      IMPACT_APP_DSN: postgresql://impact_app_login:${IMPACT_LOGIN_PASSWORD_APP}@postgres:5432/impact
      IMPACT_IDENTITY_DSN: postgresql://impact_identity_login:${IMPACT_LOGIN_PASSWORD_IDENTITY}@postgres:5432/impact
      IMPACT_PLATFORM_DSN: postgresql://impact_platform_login:${IMPACT_LOGIN_PASSWORD_PLATFORM}@postgres:5432/impact
      IMPACT_PUBLIC_ORIGIN: https://${APP_HOST:?}
      IMPACT_ISSUER: https://${AUTH_HOST}/realms/impact
      IMPACT_CLIENT_ID: impact-web
      IMPACT_AUDIENCE: impact-api
      IMPACT_JWKS_URL: https://${AUTH_HOST}/realms/impact/protocol/openid-connect/certs
      IMPACT_AUTHORIZATION_URL: https://${AUTH_HOST}/realms/impact/protocol/openid-connect/auth
      IMPACT_TOKEN_URL: https://${AUTH_HOST}/realms/impact/protocol/openid-connect/token
      IMPACT_END_SESSION_URL: https://${AUTH_HOST}/realms/impact/protocol/openid-connect/logout
      IMPACT_REQUIRED_ACR: urn:impact:acr:mfa
      IMPACT_COOKIE_SECRET: ${IMPACT_COOKIE_SECRET:?}
      IMPACT_INVITATION_SECRET: ${IMPACT_INVITATION_SECRET:?}
      IMPACT_DELIVERY_SECRET: ${IMPACT_DELIVERY_SECRET:?}
      # Grace secrets after a rotation (deploy/rotate-secrets.sh); empty until the first one.
      IMPACT_COOKIE_SECRET_PREVIOUS: ${IMPACT_COOKIE_SECRET_PREVIOUS:-}
      IMPACT_INVITATION_SECRET_PREVIOUS: ${IMPACT_INVITATION_SECRET_PREVIOUS:-}
      IMPACT_DELIVERY_SECRET_PREVIOUS: ${IMPACT_DELIVERY_SECRET_PREVIOUS:-}
      # The provider's TLS certificate is verified against this bundle: the image's system store
      # on the server (Let's Encrypt); the system store plus Caddy's internal root in the CI stack,
      # which deploy/update.sh writes to <impact home>/ca/bundle.pem.
      SSL_CERT_FILE: ${IMPACT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
      # Evidence bytes (v0.22): a private, content-addressed store on the named volume below, read
      # only through the API's mediated download. The scanner recognises the EICAR test file only;
      # it is not an anti-malware engine ("none" makes every scan FAILED and nothing downloadable).
      IMPACT_OBJECT_STORE_DIR: /var/lib/impact/objects
      IMPACT_EVIDENCE_SCANNER: ${IMPACT_EVIDENCE_SCANNER:-eicar-signature}
      # Operations summary written by deploy/ops-check.sh (backup age, disk, drill, alerts), read by
      # the operator-only GET /v1/platform/metrics.
      IMPACT_OPS_STATUS_FILE: /var/lib/impact/ops/ops-status.json
      # Sign-in accounts from the control plane (v0.26a): the realm's admin API on the internal
      # network through the impact-provisioner service account (user management only).
      IMPACT_PROVIDER_ADMIN: keycloak
      IMPACT_PROVIDER_ADMIN_URL: http://keycloak:8080
      IMPACT_PROVIDER_ADMIN_REALM: impact
      IMPACT_PROVIDER_ADMIN_CLIENT_ID: impact-provisioner
      IMPACT_PROVIDER_ADMIN_CLIENT_SECRET: ${IMPACT_PROVISIONER_SECRET:?}
    volumes:
      - ${IMPACT_CA_DIR:?}:/etc/impact-ca:ro
      - objects:/var/lib/impact/objects
      - ${IMPACT_OPS_DIR:?}:/var/lib/impact/ops:ro
    networks: [backend, edge]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request as u; r=u.Request('http://127.0.0.1:8000/health/ready',headers={'Host':os.environ['IMPACT_PUBLIC_ORIGIN'].split('//')[1]}); sys.exit(0 if u.urlopen(r,timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Loopback mail capture: the worker shares this container's network namespace, so its SMTP
  # adapter reaches 127.0.0.1:2525. Replaced by a real provider via SMTP_* in config.env (the
  # password in secrets.env); the namespace is on `edge`, which has a route out, so no change
  # of wiring is needed for a provider (deploy/mail-check.sh proves the path).
  mailsink:
    <<: [*app, *hardened]
    restart: unless-stopped
    command: ["python", "deploy/mail_sink.py", "--host", "127.0.0.1", "--port", "2525", "--sink", "/var/lib/impact/mail/captured.jsonl"]
    volumes:
      - mail:/var/lib/impact/mail
    networks: [backend, edge]

  worker:
    <<: [*app, *hardened]
    restart: unless-stopped
    command: ["python", "-m", "impact_api.worker", "--worker-id", "staging-worker-1"]
    network_mode: "service:mailsink"
    environment:
      IMPACT_ENVIRONMENT: staging
      IMPACT_REQUIRE_UNPRIVILEGED_DB: "1"
      IMPACT_WORKER_DSN: postgresql://impact_worker_login:${IMPACT_LOGIN_PASSWORD_WORKER}@postgres:5432/impact
      IMPACT_PUBLIC_ORIGIN: https://${APP_HOST}
      IMPACT_INVITATION_SECRET: ${IMPACT_INVITATION_SECRET}
      IMPACT_DELIVERY_SECRET: ${IMPACT_DELIVERY_SECRET}
      IMPACT_INVITATION_SECRET_PREVIOUS: ${IMPACT_INVITATION_SECRET_PREVIOUS:-}
      IMPACT_DELIVERY_SECRET_PREVIOUS: ${IMPACT_DELIVERY_SECRET_PREVIOUS:-}
      IMPACT_EMAIL_ADAPTER: smtp
      IMPACT_SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      IMPACT_SMTP_PORT: ${SMTP_PORT:-2525}
      IMPACT_SMTP_USERNAME: ${SMTP_USERNAME:-}
      IMPACT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IMPACT_SMTP_FROM: ${SMTP_FROM:?}
      # v0.27 email readiness: STARTTLS policy, optional extra trust anchor, send rate limits.
      IMPACT_SMTP_STARTTLS: ${SMTP_STARTTLS:-auto}
      IMPACT_SMTP_CA_FILE: ${SMTP_CA_FILE:-}
      IMPACT_EMAIL_RATE_LIMIT: ${EMAIL_RATE_LIMIT:-0}
      IMPACT_EMAIL_TENANT_RATE_LIMIT: ${EMAIL_TENANT_RATE_LIMIT:-0}
      IMPACT_EMAIL_RATE_WINDOW_SECONDS: ${EMAIL_RATE_WINDOW_SECONDS:-60}
    depends_on:
      mailsink: {condition: service_started}
      postgres: {condition: service_healthy}

  executor:
    <<: [*app, *hardened]
    restart: unless-stopped
    command: ["python", "-m", "impact_api.application_executor", "--executor-id", "staging-executor-1"]
    networks: [backend]
    environment:
      IMPACT_ENVIRONMENT: staging
      IMPACT_REQUIRE_UNPRIVILEGED_DB: "1"
      IMPACT_EXECUTOR_DSN: postgresql://impact_executor_login:${IMPACT_LOGIN_PASSWORD_EXECUTOR}@postgres:5432/impact
    depends_on:
      postgres: {condition: service_healthy}

  caddy:
    # Public reverse proxy; the executor remains solely on backend.
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
      AUTH_HOST: ${AUTH_HOST}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${IMPACT_STATUS_DIR:?}:/srv/status:ro
    networks:
      edge:
        # The API fetches the provider's keys and Keycloak calls the back-channel logout URL by
        # their public names; inside the stack those names resolve to Caddy directly.
        aliases:
          - ${APP_HOST}
          - ${AUTH_HOST}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/bash", "/opt/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      KEEP_DAILY: "7"
      KEEP_WEEKLY: "4"
      # Refuse an attempt below this much free space (or twice the newest set, if larger).
      MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1024}
      IMPACT_COMMIT: ${IMPACT_TAG}
    volumes:
      - ./backup.sh:/opt/backup/backup.sh:ro
      - backups:/backups
      # Evidence bytes, read-only: each set carries a tar of them (taken after the dumps).
      - objects:/objects:ro
      # Host directory for backup-status.json (read by deploy/ops-check.sh); no secret goes there.
      - ${IMPACT_OPS_DIR:?}:/ops
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  # Weekly restore drill (profile "drill"; started only by deploy/restore-drill.sh and removed with
  # its anonymous data volume afterwards). A throwaway PostgreSQL on its own internal network: it
  # sees the backup sets read-only and nothing of the live database, its volume or its network.
  drill-db:
    image: postgres:17
    profiles: ["drill"]
    logging: *logging
    environment:
      # Generated per drill by deploy/restore-drill.sh; empty makes the image refuse to start.
      POSTGRES_PASSWORD: ${DRILL_DB_PASSWORD:-}
    volumes:
      - backups:/backups:ro
      - ./drill_restore.sh:/opt/drill/drill_restore.sh:ro
    networks: [drill]
    shm_size: 128m

  # The drill's checks (deploy/restore_check.py in the application image): object digests against
  # the restored file_blob rows, the migrator checksum pass and the security invariants.
  drill-check:
    <<: [*app, *hardened]
    profiles: ["drill"]
    # The backup sets are root's (0700/0600); root in this container, still with every capability
    # dropped, read-only and on the drill network only, reads them as their owner.
    user: "0:0"
    command: ["python", "deploy/restore_check.py"]
    environment:
      # The password arrives as PGPASSWORD from deploy/restore-drill.sh, never in this file.
      IMPACT_DRILL_DSN: postgresql://postgres@drill-db:5432/impact
      IMPACT_DRILL_IDP_DSN: postgresql://postgres@drill-db:5432/keycloak
    volumes:
      - backups:/backups:ro
    networks: [drill]

networks:
  # The database network has no route out of the host.
  backend:
    internal: true
  edge: {}
  # The restore drill's network: no route out and no other service on it.
  drill:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  backups: {}
  mail: {}
  # Evidence objects. Each nightly backup set carries a tar of this volume (deploy/backup.sh); the
  # database rows name every object by SHA-256 and the weekly restore drill checks them.
  objects: {}
