<g font-size="19"><text x="28" y="420">Identity provider supplies identity only. Roles are not grants. Calls leave the database transaction.</text><text x="28" y="451">Current plans are Draft. Advisory availability checks configuration, not provider funding.</text></g>
<rect x="28" y="484" width="1144" height="304" rx="8" fill="#f8f5eb" stroke="#988850" stroke-width="2" stroke-dasharray="8 5"/>
<text x="50" y="521" font-size="24" font-weight="bold">Proposed operated services   No current endpoints or grants implied</text>
<g fill="#ffffff" stroke="#988850" stroke-width="1.5"><rect x="50" y="546" width="340" height="101" rx="6"/><rect x="430" y="546" width="340" height="101" rx="6"/><rect x="810" y="546" width="340" height="101" rx="6"/></g>
<g font-size="22" text-anchor="middle"><text x="220" y="582" font-weight="bold">Capacity and advice</text><text x="220" y="615" font-size="19">Cohorts, evidence, cases, tasks</text><text x="600" y="582" font-weight="bold">Procurement and delivery</text><text x="600" y="615" font-size="19">Offers, decisions, milestones</text><text x="980" y="582" font-weight="bold">Governed marketplace</text><text x="980" y="615" font-size="19">Reviewed public snapshots</text></g>
<text x="50" y="684" font-size="20">All proposed services reuse current authority, immutable revisions, audit and controlled disclosure.</text>
<text x="50" y="718" font-size="20">Connectors, outcomes, support, export and content lifecycle require approved policies and tests.</text>
<text x="50" y="752" font-size="20" font-weight="bold">Payments are conditional R3 and depend on an owner approved financial operating model.</text>
<text x="28" y="817" font-size="17">Solid blue boxes current bounded implementation     Dashed amber area proposed scope</text>
