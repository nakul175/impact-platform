<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title description">
<title id="title">Nonprofit AI enablement architecture</title>
<desc id="description">Current React client calls a strict FastAPI boundary, which checks current tenant authority and accesses a forced RLS revision store. Deterministic guide and catalogues need no AI call. The advisory orchestrator reserves before calling a bounded external provider adapter outside a database transaction. A separate lower band groups proposed operated services, supplier public snapshots and conditional finance.</desc>
